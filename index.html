<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Restaurant POS</title>
<style>
:root{--ink:#17231f;--muted:#68756f;--line:#e2e9e4;--bg:#f4f7f4;--green:#176b4b;--green2:#e5f2eb;--white:#fff;--orange:#a45c16;--red:#9d3d34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#153d2d;color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:4;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:750}header small{opacity:.8}.head-actions{display:flex;align-items:center;gap:10px}
.lang-switch{display:inline-flex;background:#0e2b20;border:1px solid #2a5c47;border-radius:10px;padding:3px;gap:2px}
.lang-btn{background:transparent;color:#d6e7df;padding:6px 10px;border-radius:7px;font-size:13px;font-weight:650}.lang-btn.active{background:var(--white);color:#153d2d}
.wrap{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.9fr);gap:18px}
.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px #142b1b08;overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid var(--line)}
h2{font-size:17px;margin:0 0 10px}.searchrow{display:flex;gap:9px}.searchrow input{flex:1}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid #d6dfd9;border-radius:9px;background:#fff;color:var(--ink);min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #a9d3ba;border-color:var(--green)}
.tabs{display:flex;gap:7px;overflow:auto;padding:12px 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:30px;padding:8px 12px;font-size:13px;cursor:pointer}.tab.active{background:var(--green);color:white;border-color:var(--green)}
.menu{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:calc(100vh - 240px);overflow:auto}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:104px}
.itemname{font-weight:650}.note{font-size:12px;color:var(--orange)}.itemfoot{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:auto}.price{font-weight:750}.itembuttons{display:flex;gap:6px}.quick{background:#e5f2eb;color:#176b4b;border:1px solid #cfe5d7;border-radius:8px;padding:8px 10px;font-weight:700}.editline{background:#edf2ee;color:#176b4b;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700}.searchhint{font-size:11px;color:var(--muted);margin-top:6px}
button{font:inherit;cursor:pointer;border:0}.add{background:var(--green);color:white;border-radius:8px;padding:8px 12px;font-weight:650}.add:active,.primary:active{transform:scale(.98)}
.cartpanel{position:sticky;top:80px;align-self:start}.fields{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:0 0 5px}.field.full{grid-column:1/-1}.phone-input{font-size:20px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.cartitems{padding:8px 16px;max-height:34vh;overflow:auto;min-height:80px}.empty{color:var(--muted);text-align:center;padding:26px 10px}
.cartline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.cartline strong{display:block}.cartline small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.lineactions{display:flex;align-items:center;gap:7px}.qty{display:flex;align-items:center;gap:7px}.qty button,.remove{width:28px;height:28px;border-radius:7px;background:#eef3ef;color:var(--ink)}.remove{color:#9d3d34}
.totals{padding:14px 16px;background:#fafcfb;border-top:1px solid var(--line)}.totalrow{display:flex;justify-content:space-between;align-items:center;margin:6px 0;color:var(--muted)}.totalrow.grand{font-size:19px;font-weight:800;color:var(--ink);padding-top:8px;border-top:1px solid var(--line)}
.cashbox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;gap:8px}.cashinputwrap{display:flex;align-items:center;gap:6px;width:125px}.cashinputwrap input{padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}.changerow{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:750;color:var(--green)}.changerow.short{color:var(--red)}.changerow.neutral{color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;padding:14px 16px}.primary{background:var(--green);color:white;padding:12px 15px;border-radius:10px;font-weight:700;flex:1}.secondary{background:#edf2ee;color:var(--ink);padding:12px 14px;border-radius:10px}
.taxrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}.taxrow input{width:75px;padding:6px}
.modalback{position:fixed;inset:0;background:#10201888;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modalback.show{display:flex}.modal{background:white;width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:20px;box-shadow:0 20px 70px #0004}.modal h2{margin-bottom:4px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.check{display:flex;gap:8px;align-items:center;background:#f6f8f6;border-radius:9px;padding:9px}.check input{width:auto}.modal .field{margin:12px 0}.modalfoot{display:flex;gap:9px;margin-top:18px}.modalfoot button{flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#163d2d;color:white;padding:10px 16px;border-radius:30px;display:none;z-index:20}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:12px}.cartpanel{position:static}.menu{max-height:none;grid-template-columns:repeat(2,minmax(0,1fr))}.cartitems{max-height:32vh}}
@media(max-width:520px){header{padding:13px 15px}.wrap{padding:9px;gap:10px}.menu{grid-template-columns:1fr;padding:10px}.fields{grid-template-columns:1fr 1fr}.item{min-height:90px}.panel{border-radius:12px}.actions{padding:12px}.panelhead{padding:13px}}
@media print{header,.menuPanel,.fields,.actions,.taxrow,.modalback{display:none!important}.wrap{display:block;padding:0}.cartpanel{position:static;border:0;box-shadow:none}.cartitems{max-height:none}.panel{border:0}.totals{background:white}}
</style></head>
<body>
<header>
  <div><h1 id="appTitle">Restaurant POS</h1><small id="appSubtitle">Local order entry · Menu & orders stay on this device</small></div>
  <div class="head-actions">
    <div class="lang-switch" role="group" aria-label="Language switcher">
      <button type="button" class="lang-btn active" id="langEn" onclick="setLang('en')">EN</button>
      <button type="button" class="lang-btn" id="langZh" onclick="setLang('zh')">中文</button>
    </div>
    <button type="button" class="secondary" id="exportBtn" onclick="exportOrders()">Export orders</button>
  </div>
</header>
<div class="wrap">
<section class="panel menuPanel"><div class="panelhead"><h2 id="menuHeading">Menu</h2><div class="searchrow"><input id="search" placeholder="Search dishes, ingredients, or misspellings..." oninput="renderMenu()"><button type="button" class="secondary" id="clearSearchBtn" onclick="document.getElementById('search').value='';renderMenu()">Clear</button></div><div class="searchhint" id="searchHint">Search works with word order, partial words, and common typos.</div></div><div class="tabs" id="tabs"></div><div class="menu" id="menu"></div></section>
<aside class="panel cartpanel"><div class="panelhead"><h2 id="orderHeading">Current order</h2></div>
<div class="fields">
<div class="field"><label id="lblCustomer" for="customer">Customer name</label><input id="customer" placeholder="Name"></div>
<div class="field"><label id="lblPhone" for="phone">Phone</label><input id="phone" class="phone-input" placeholder="Phone number" inputmode="tel" autocomplete="tel" aria-label="Phone number"></div>
<div class="field"><label id="lblOrderType" for="orderTypeInput">Order type</label><input id="orderTypeInput" value="Takeout" readonly aria-label="Order type: Takeout"></div>
<div class="field"><label id="lblTable" for="table">Pickup name / order #</label><input id="table" placeholder="Optional"></div>
<div class="field"><label id="lblPayment" for="paymentMethod">Payment method</label><select id="paymentMethod" onchange="onPaymentMethodChange()"></select></div>
<div class="field full"><label id="lblOrderNotes" for="ordernotes">Order notes</label><input id="ordernotes" placeholder="Allergy alert, timing, etc."></div>
</div>
<div class="cartitems" id="cart"></div>
<div class="totals">
<div class="totalrow"><span id="lblSubtotal">Pre-tax subtotal</span><strong id="subtotal">$0.00</strong></div>
<div class="totalrow"><span id="lblTax">Tax</span><strong id="taxamount">$0.00</strong></div>
<div class="totalrow grand"><span id="lblTotal">Total</span><span id="total">$0.00</span></div>
<div class="cashbox">
  <div class="totalrow" style="margin:0">
    <label id="lblCashTendered" for="cashTendered" style="cursor:pointer">Cash tendered</label>
    <div class="cashinputwrap">
      <span>$</span>
      <input id="cashTendered" type="number" min="0" step="0.01" placeholder="0.00" oninput="updateChange()">
    </div>
  </div>
  <div class="changerow neutral" id="changerow">
    <span id="changelabel">Change due</span>
    <strong id="changeamount">—</strong>
  </div>
</div>
<div class="taxrow"><span id="lblTaxRatePrefix">Tax rate</span> <input id="taxrate" type="number" min="0" max="100" step=".01" value="0" onchange="renderCart()">%</div>
</div>
<div class="actions"><button type="button" class="secondary" id="clearOrderBtn" onclick="clearCart()">Clear order</button><button type="button" class="primary" id="completeOrderBtn" onclick="completeOrder()">Complete & print</button></div></aside>
</div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalname">Customize item</h2><div class="sub" id="modalprice"></div>
<div class="field"><label id="lblModalDish" for="modalDish">Dish</label><select id="modalDish" onchange="changeModalDish()"></select></div>
<div class="field" id="proteinField" style="display:none"><label id="lblProteinChoice" for="proteinChoice">Protein choice</label><select id="proteinChoice" onchange="updateProteinPrice()"></select><div class="sub" id="proteinHint" style="margin:5px 0 0">Mixed adds $1.00</div></div>
<div class="field"><label id="lblRice" for="rice">Rice option</label><select id="rice" onchange="updateModalDishSelect()"></select></div>
<div class="field"><label id="lblPrepRequests">Preparation requests</label><div class="checks" id="prepChecks"></div></div>
<div class="field"><label id="lblCustomNotes" for="customnotes">Other changes / allergy notes</label><textarea id="customnotes" rows="3" placeholder="e.g. sauce on the side, extra spicy..."></textarea></div>
<div class="field"><label id="lblModalQty" for="modalqty">Quantity</label><input id="modalqty" type="number" min="1" max="99" value="1"></div>
<div class="modalfoot"><button type="button" class="secondary" id="cancelModalBtn" onclick="closeModal()">Cancel</button><button type="button" class="primary" id="saveConfigured" onclick="addConfigured()">Add to order</button></div></div></div>
<div class="toast" id="toast"></div>

function rebuildModalOptions(dishIdx,proteinVal,riceVal,checkedVals){

    ["Pork",t("proteinPork")],

    ["Beef",t("proteinBeef")],

function formatChangeLabel(c){
  if(c.startsWith("Protein: ")){
    const isMixed=c.includes(" (+$1.00)");
    const rawP=c.replace(/^Protein: /,"").replace(/ \(\+\$1\.00\)$/,"");
    const pMap={Vegetable:"proteinVeg",Pork:"proteinPork",Chicken:"proteinChicken",Beef:"proteinBeef",Shrimp:"proteinShrimp",Mixed:"proteinMixed"};
    const pText=pMap[rawP]?t(pMap[rawP]):rawP;
    return t("proteinPrefix")+pText+(isMixed?t("mixedExtraSuffix"):"");
  }
  const prepIdx=I18N.en.prepOptions.indexOf(c);
  if(prepIdx!==-1)return I18N[lang].prepOptions[prepIdx]||c;
  const riceMap={"White rice":"riceWhite","Brown rice":"riceBrown","Vegetable fried rice":"riceVegFried","No rice":"noRice"};
  if(riceMap[c])return t(riceMap[c]);
  return c;
}

function setCategory(category){activeCategory=category;renderTabs();renderMenu()}
function renderTabs(){document.getElementById("tabs").innerHTML=["All",...categories].map(c=>`<button type="button" class="tab ${activeCategory===c?'active':''}" data-category="${esc(c)}">${esc(tCategory(c))}</button>`).join("")}
document.getElementById("tabs").addEventListener("click",e=>{const btn=e.target.closest(".tab");if(btn)setCategory(btn.dataset.category)});
function normalizeSearch(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^\p{L}\p{N}]+/gu," ").trim().split(/\s+/).filter(Boolean)}
function editDistance(a,b){if(Math.abs(a.length-b.length)>2)return 99;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
function searchScore(item,q){let terms=normalizeSearch(q);if(!terms.length)return 1;let extraZh=[DISH_ZH[item.name]||"",CATEGORY_ZH[item.category]||"",NOTES_ZH[item.notes]||""].join(" ");let words=normalizeSearch(item.name+" "+item.category+" "+item.notes+" "+extraZh);let score=0;for(let term of terms){let best=0;for(let word of words){if(word===term)best=Math.max(best,12);else if(word.includes(term)||word.startsWith(term)||term.startsWith(word))best=Math.max(best,8-Math.min(3,Math.abs(word.length-term.length)));else if(term.length>=4&&editDistance(term,word)<=1)best=Math.max(best,5);else if(term.length>=5&&editDistance(term,word)<=2)best=Math.max(best,2)}if(best===0)return 0;score+=best}return score/terms.length}
function renderMenu(){let q=document.getElementById("search").value;let list=MENU.map((x,i)=>({x,i,score:searchScore(x,q)})).filter(o=>(activeCategory==="All"||o.x.category===activeCategory)&&o.score>0).sort((a,b)=>b.score-a.score||tDish(a.x.name).localeCompare(tDish(b.x.name),lang==="zh"?"zh-Hans":"en"));document.getElementById("menu").innerHTML=list.map(({x,i})=>{let dn=tDish(x.name),nt=tNotes(x.notes);return `<article class="item"><div class="itemname">${esc(dn)}</div>${nt?`<div class="note">${esc(nt)}</div>`:""}<div class="itemfoot"><span class="price">${money(x.price)}</span><div class="itembuttons"><button type="button" class="quick" onclick="quickAdd(${i})">${esc(t("quickAdd"))}</button><button type="button" class="add" onclick="openModal(${i})">${esc(t("customize"))}</button></div></div></article>`}).join("")||`<div class="empty">${esc(t("noMatches"))}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const PROTEIN_DISHES=new Set(["Fried Rice","Lo Mein (Spaghetti)","Mei Fun (Thin Rice Noodle)","Chow Fun (Flat Soft Rice Noodle)","Bill & Harry Style Noodle","Chow Mein"]);
function proteinEligible(dish){return PROTEIN_DISHES.has(dish.name)}
function selectedProtein(){return document.getElementById("proteinChoice").value}
function updateProteinPrice(){
  const i=Number(document.getElementById("modalDish").value),dish=MENU[i];
  const choice=selectedProtein();
  const price=dish.price+(choice==="Mixed"?1:0);
  const nt=tNotes(dish.notes);
  document.getElementById("modalprice").textContent=tCategory(dish.category)+" · "+money(price)+(nt?" · "+nt:"");
}
function setModalDish(i){
  selected=MENU[i];document.getElementById("modalDish").value=String(i);
  document.getElementById("modalname").textContent=tDish(selected.name);
  const field=document.getElementById("proteinField"),eligible=proteinEligible(selected);

  if(!eligible)document.getElementById("proteinChoice").value="";
  updateProteinPrice();
}
function changeModalDish(){setModalDish(Number(document.getElementById("modalDish").value))}
function updateModalDishSelect(){}
function fillModal(changes,qty){
  document.getElementById("rice").value="";document.getElementById("customnotes").value="";
  document.querySelectorAll("#prepChecks input").forEach(x=>x.checked=false);
  document.getElementById("proteinChoice").value="";
  let known=I18N.en.prepOptions;
  (changes||[]).forEach(c=>{
    if(c.startsWith("Protein: ")){document.getElementById("proteinChoice").value=c.replace(/^Protein: /,"").replace(/ \(\+\$1\.00\)$/,"")}
    else if(known.includes(c)){let el=[...document.querySelectorAll("#prepChecks input")].find(x=>x.value===c);if(el)el.checked=true}
    else if(["White rice","Brown rice","Vegetable fried rice","No rice"].includes(c)){document.getElementById("rice").value=c}
    else{let box=document.getElementById("customnotes");box.value+=(box.value?"; ":"")+c}
  });
  document.getElementById("modalqty").value=qty||1;updateProteinPrice()

function openModal(i){editingCartId=null;setModalDish(i);fillModal([],1);document.getElementById("saveConfigured").textContent=t("addToOrder");document.getElementById("modalback").classList.add("show")}
function quickAdd(i){let x=MENU[i];cart.push({id:Date.now()+Math.random(),menuIndex:i,name:x.name,category:x.category,price:x.price,qty:1,changes:[]});renderCart();toast(t("quickAdded")+tDish(x.name))}
function editCartItem(id){let x=cart.find(y=>String(y.id)===id);if(!x)return;editingCartId=x.id;setModalDish(Number.isInteger(x.menuIndex)?x.menuIndex:Math.max(0,MENU.findIndex(m=>m.name===x.name&&m.price===x.price)));fillModal(x.changes,x.qty);document.getElementById("saveConfigured").textContent=t("saveChanges");document.getElementById("modalback").classList.add("show")}

function addConfigured(){
  let changes=[...document.querySelectorAll("#prepChecks input:checked")].map(x=>x.value);
  let rice=document.getElementById("rice").value;if(rice)changes.push(rice);
  let protein=selectedProtein();if(protein)changes.push("Protein: "+protein+(protein==="Mixed"?" (+$1.00)":""));
  let other=document.getElementById("customnotes").value.trim();if(other)changes.push(other);
  let qty=Math.max(1,Math.min(99,parseInt(document.getElementById("modalqty").value)||1));
  let i=Number(document.getElementById("modalDish").value),dish=MENU[i];
  let finalPrice=dish.price+(protein==="Mixed"?1:0);
  if(editingCartId!==null){
    let target=cart.find(x=>x.id===editingCartId);
    if(target)Object.assign(target,{menuIndex:i,name:dish.name,category:dish.category,price:finalPrice,qty,changes});
    toast(t("itemUpdated"))
  }else{
    cart.push({id:Date.now()+Math.random(),menuIndex:i,name:dish.name,category:dish.category,price:finalPrice,qty,changes});
    toast(t("addedToOrder"))
  }
  editingCartId=null;closeModal();renderCart()
}
function onPaymentMethodChange(){
  const method=document.getElementById("paymentMethod").value;
  if(method==="Cash")document.getElementById("cashTendered").focus();
  updateChange();
}
function updateChange(){
  const raw=document.getElementById("cashTendered").value;
  const row=document.getElementById("changerow");
  const label=document.getElementById("changelabel");
  const amtEl=document.getElementById("changeamount");
  if(raw.trim()===""){
    row.className="changerow neutral";
    label.textContent=t("changeDue");
    amtEl.textContent="—";
    return null;
  }
  const cash=Number(raw);
  if(!Number.isFinite(cash)||cash<0){
    row.className="changerow neutral";
    label.textContent=t("changeDue");
    amtEl.textContent="—";
    return null;
  }
  const diffCents=Math.round(cash*100)-Math.round(currentGrandTotal*100);
  const diff=diffCents/100;
  if(diffCents<0){
    row.className="changerow short";
    label.textContent=t("stillOwed");
    amtEl.textContent=money(Math.abs(diff));
  }else{
    row.className="changerow";
    label.textContent=t("changeDue");
    amtEl.textContent=money(diff);
  }
  return {cashTendered:cash,changeDue:diff};
}
function renderCart(){let el=document.getElementById("cart");if(!cart.length)el.innerHTML=`<div class="empty">${t("emptyCart")}</div>`;else el.innerHTML=cart.map(x=>{let chText=x.changes.length?esc(x.changes.map(formatChangeLabel).join(" · ")):esc(t("noCustomizations"));return `<div class="cartline"><div><strong>${esc(tDish(x.name))}</strong><small>${chText}</small><small>${money(x.price)} ${esc(t("eachSuffix"))}</small><button type="button" class="editline" onclick="editCartItem('${x.id}')">${esc(t("editItem"))}</button></div><div class="lineactions"><div class="qty"><button type="button" onclick="changeQty('${x.id}',-1)">−</button><b>${x.qty}</b><button type="button" onclick="changeQty('${x.id}',1)">+</button></div><button type="button" class="remove" onclick="removeItem('${x.id}')" title="${esc(t("removeTitle"))}">×</button><b>${money(x.price*x.qty)}</b></div></div>`}).join("");
let sub=cart.reduce((s,x)=>s+x.price*x.qty,0),rate=Math.max(0,Number(document.getElementById("taxrate").value)||0)/100,tax=sub*rate;currentGrandTotal=sub+tax;document.getElementById("subtotal").textContent=money(sub);document.getElementById("taxamount").textContent=money(tax);document.getElementById("total").textContent=money(currentGrandTotal);updateChange()}
function changeQty(id,d){let x=cart.find(x=>String(x.id)===id);if(x){x.qty+=d;if(x.qty<1)cart=cart.filter(y=>y!==x);renderCart()}}

  cart=[];

}

  }

function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function completeOrder(){if(!cart.length){alert(t("addItemFirst"));return}const cashInfo=updateChange();let order={date:new Date().toISOString(),customer:document.getElementById("customer").value,phone:document.getElementById("phone").value,orderType:"Takeout",table:document.getElementById("table").value,paymentMethod:document.getElementById("paymentMethod").value,notes:document.getElementById("ordernotes").value,items:cart,subtotal:cart.reduce((s,x)=>s+x.price*x.qty,0),taxRate:Number(document.getElementById("taxrate").value)||0,cashTendered:cashInfo?cashInfo.cashTendered:null,changeDue:cashInfo?cashInfo.changeDue:null};order.tax=order.subtotal*order.taxRate/100;order.total=order.subtotal+order.tax;let history=JSON.parse(localStorage.getItem("restaurantPOS_orders")||"[]");history.push(order);localStorage.setItem("restaurantPOS_orders",JSON.stringify(history));printReceipt(order);resetOrderFields();renderCart();toast(t("orderSaved"))}
function formatPaymentForReceipt(pm){
  const map={"":t("payUnspecified"),"Cash":t("payCash"),"Credit card":t("payCredit"),"Debit card":t("payDebit"),"Other":t("payOther"),"Not yet paid":t("payUnpaid")};
  return Object.prototype.hasOwnProperty.call(map,pm)?map[pm]:pm;
}
function printReceipt(o){let w=window.open("","_blank","width=420,height=700");if(!w){alert(t("allowPopups"));return}const locale=lang==="zh"?"zh-CN":undefined;const orderTypeLabel=o.orderType==="Takeout"?t("takeout"):o.orderType;w.document.write(`<html lang="${lang==="zh"?"zh-CN":"en"}"><head><title>${esc(t("receiptTitle"))}</title><style>body{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;color:#111}h2{text-align:center}small{color:#555}.line{display:flex;justify-content:space-between;gap:15px;margin:9px 0}.custom{font-size:12px;color:#555;margin:3px 0 8px}.rule{border-top:1px dashed #777;margin:14px 0}.total{font-weight:bold;font-size:18px}</style></head><body><h2>${esc(t("receiptHeading"))}</h2><p>${new Date(o.date).toLocaleString(locale)}<br>${esc(orderTypeLabel)} ${o.table?"· "+esc(o.table):""}<br>${esc(t("receiptPayment"))}: ${esc(formatPaymentForReceipt(o.paymentMethod||""))}<br>${esc(o.customer||t("receiptGuest"))} ${o.phone?"· "+esc(o.phone):""}</p><div class="rule"></div>${o.items.map(x=>`<div class="line"><span>${x.qty} × ${esc(tDish(x.name))}</span><b>${money(x.qty*x.price)}</b></div>${x.changes.length?`<div class="custom">${esc(x.changes.map(formatChangeLabel).join(" · "))}</div>`:""}`).join("")}<div class="rule"></div><div class="line"><span>${esc(t("subtotal"))}</span><b>${money(o.subtotal)}</b></div><div class="line"><span>${esc(t("tax"))} (${o.taxRate}%)</span><b>${money(o.tax)}</b></div><div class="line total"><span>${esc(t("total"))}</span><span>${money(o.total)}</span></div>${o.cashTendered!==null?`<div class="line"><span>${esc(t("cashTendered"))}</span><b>${money(o.cashTendered)}</b></div><div class="line total"><span>${esc(o.changeDue>=0?t("changeDue"):t("stillOwed"))}</span><span>${money(Math.abs(o.changeDue))}</span></div>`:""}${o.notes?`<p>${esc(t("receiptNotes"))}: ${esc(o.notes)}</p>`:""}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function exportOrders(){let data=localStorage.getItem("restaurantPOS_orders")||"[]";let blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="restaurant-orders.json";a.click();URL.revokeObjectURL(url)}
